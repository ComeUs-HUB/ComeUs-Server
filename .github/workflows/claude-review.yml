name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude re-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 범위 리뷰(`A..B`)에서 git diff가 커밋 이력을 읽어야 한다
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            REVIEW REQUEST: ${{ github.event.comment.body || '(PR 열림 또는 Ready for review — 전체 리뷰)' }}

            이 PR의 코드를 리뷰해주세요. 한국어로 답변해주세요.

            **리뷰 범위**
            - 이 저장소는 도메인 하나를 PR 하나로 열고 단계별 커밋을 계속 쌓는다. 단계마다 리뷰를 요청한다
            - REVIEW REQUEST에 커밋 범위(`A..B`)가 있으면 **그 범위만** 리뷰하세요.
              `git log --oneline A..B`와 `git diff A..B`로 변경을 읽고, `gh pr diff`(PR 전체)는 맥락 확인에만 쓰세요
            - 범위가 없으면 `gh pr diff`로 PR 전체를 리뷰하세요
            - `gh pr view --comments`로 이전 리뷰를 먼저 읽고, **이미 지적했고 대응된 사항은 반복하지 마세요.**
              범위 안의 변경이 이전 지적을 해소했는지는 확인해 주세요

            **먼저 docs/README.md 를 읽고 이 저장소의 규칙을 파악하세요.**
            - 결정 근거는 docs/decisions/ 의 ADR에 있습니다. **이미 ADR로 확정된 사항을 다시
              문제 삼지 말고**, 구현이 그 ADR을 지키는지를 보세요
            - 주석 규칙은 docs/conventions/javadoc.md,
              응답 포맷은 docs/conventions/api-response.md,
              에러 코드는 docs/conventions/error-codes.md 입니다
            - **주석에는 분량 상한이 있습니다.** javadoc.md의 "확인" 절 명령을 변경된 파일에
              돌려 위반을 확인하세요 — HTML 치장·이모지·80자 초과·클래스 Javadoc 본문 5줄
              초과는 현재 저장소 전체가 0건이므로, 새로 생기면 지적해 주세요
            - API 계약은 docs/domains/ 에 있습니다

            다음 항목들을 확인해주세요:
            - 코드 품질 및 가독성
            - 잠재적인 버그나 에러
            - 성능 이슈
            - 보안 취약점
            - 모범 사례 준수 여부

            발견된 문제점과 개선 제안을 구체적으로 설명해주세요.
            문서와 어긋나는 구현을 찾으면 어느 문서의 어느 규칙인지 함께 적어주세요.

            Use `gh pr comment` for top-level feedback.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
