name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude re-review'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            이 PR의 코드를 리뷰해주세요. 한국어로 답변해주세요.

            **먼저 docs/README.md 를 읽고 이 저장소의 규칙을 파악하세요.**
            - 결정 근거는 docs/decisions/ 의 ADR에 있습니다. **이미 ADR로 확정된 사항을 다시
              문제 삼지 말고**, 구현이 그 ADR을 지키는지를 보세요
            - 주석 규칙은 docs/conventions/javadoc.md (분량 상한이 있습니다),
              응답 포맷은 docs/conventions/api-response.md,
              에러 코드는 docs/conventions/error-codes.md 입니다
            - API 계약은 docs/domains/ 에 있습니다

            다음 항목들을 확인해주세요:
            - 코드 품질 및 가독성
            - 잠재적인 버그나 에러
            - 성능 이슈
            - 보안 취약점
            - 모범 사례 준수 여부

            발견된 문제점과 개선 제안을 구체적으로 설명해주세요.
            문서와 어긋나는 구현을 찾으면 어느 문서의 어느 규칙인지 함께 적어주세요.

            Use `gh pr comment` for top-level feedback.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
