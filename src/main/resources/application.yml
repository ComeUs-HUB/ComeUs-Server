spring:
  application:
    name: backend
  profiles:
    active: local
  # datasource는 프로필별 파일에만 둔다 (application-local.yml / application-prod.yml).
  # 둘 다 .gitignore 대상이라 접속 정보가 저장소에 들어가지 않는다.
  jpa:
    hibernate:
      # 스키마 소유자는 Flyway다. Hibernate는 매핑이 스키마와 맞는지 검증만 한다.
      # local/prod 모두 validate로 통일 (application-prod.yml도 validate)
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000    # 30분 (ms)
  refresh-expiration: 604800000 # 7일 (ms)

# 카카오 고정 엔드포인트. 환경에 무관하므로 여기 둔다.
# client-id / client-secret / admin-key / redirect-uri 는 환경마다 다르고 비밀값이라
# 프로파일별 파일(application-local.yml / application-prod.yml, .gitignore 대상)에 둔다.
kakao:
  authorize-uri: https://kauth.kakao.com/oauth/authorize
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  unlink-uri: https://kapi.kakao.com/v1/user/unlink

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
