spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # 테스트는 H2라 MySQL 문법으로 쓰인 V1__init.sql을 실행할 수 없다.
  # 스키마는 아래 create-drop이 엔티티 매핑으로부터 만든다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

# 이 파일은 main의 application.yml을 shadow하므로, 여기에 없는 키는 테스트 컨텍스트에 존재하지 않는다.
# JwtProperties가 실제 빈이 된 5단계부터는 jwt.*가 없으면 contextLoads가 바인딩 실패로 깨진다
# (main 쪽 값은 ${JWT_SECRET}이라 어차피 테스트에서 해석되지 않는다).
# HS256이라 secret은 최소 32바이트여야 한다 — 아래 값은 48바이트다.
jwt:
  secret: test-jwt-secret-for-unit-and-context-tests-only!
  access-expiration: 1800000    # 30분 (ms)
  refresh-expiration: 604800000 # 7일 (ms)

# SecurityConfig가 CORS 구성에 app.cors.allowed-origins를 쓴다. 운영값은 프로파일별 yml(gitignore)에 있어
# 테스트 컨텍스트에는 존재하지 않으므로, CORS 통과/차단을 실제로 검증할 수 있도록 여기에 명시한다.
# (AppProperties가 null을 흡수하므로 없어도 기동은 되지만, 그러면 '전부 차단'만 검증된다.)
app:
  frontend:
    base-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000

# AuthController(8단계)가 인가 URL을 조립하며 kakao.client-id·redirect-uri·authorize-uri를 읽는다.
# 운영값은 프로파일별 yml(gitignore)에 있어 테스트 컨텍스트에는 존재하지 않는다.
# KakaoProperties에 @Validated가 없어 기동 자체는 되지만, 값이 null이면 URL 조립에서 NPE가 난다.
# 이 파일이 main application.yml을 shadow하므로 고정 엔드포인트 4종도 여기 함께 둔다.
kakao:
  client-id: test-client-id
  client-secret: test-client-secret
  admin-key: test-admin-key
  redirect-uri: http://localhost:8080/api/auth/kakao/callback
  authorize-uri: https://kauth.kakao.com/oauth/authorize
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  unlink-uri: https://kapi.kakao.com/v1/user/unlink
