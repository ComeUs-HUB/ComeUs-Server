<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth · JWT 클래스 구조</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Class</p>
    <h1>OAuth · JWT 로그인 — 클래스 구조</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pkg-auth-in-title pkg-auth-in-desc">
        <title id="pkg-auth-in-title">OAuth · JWT 로그인 클래스 구조</title>
        <desc id="pkg-auth-in-desc">global의 SecurityConfig와 Spring Security 어댑터, domain/auth의 AuthController · AuthService · KakaoOAuthClient · JwtProvider · SecureTokenGenerator · RefreshToken, domain/user의 UserController · UserService · UserRepository · User 사이의 주입 관계를 보여준다. AuthService가 UserService를 호출하는 방향이 단방향이고, 역방향은 탈퇴 때 UserController가 AuthService를 부르는 경우 하나뿐이다.</desc>
        <defs>
          <marker id="pkg-auth-in-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="pkg-auth-in-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
          <marker id="pkg-auth-in-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="pkg-auth-in-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= zones ================= -->
        <rect x="40" y="64" width="824" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="48" y="68" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GLOBAL</text>

        <rect x="40" y="376" width="824" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="48" y="380" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="389" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DOMAIN/AUTH</text>

        <rect x="920" y="64" width="320" height="472" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="928" y="68" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="936" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DOMAIN/USER</text>

        <!-- ================= arrows (before boxes) ================= -->
        <!-- within global -->
        <line x1="448" y1="144" x2="472" y2="144" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="236" y1="176" x2="236" y2="224" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="336" y1="256" x2="360" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="560" y1="256" x2="584" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>

        <!-- filter -> JwtProvider : down the left channel -->
        <path d="M 200,288 V 320 Q 200,328 192,328 H 112 Q 104,328 104,336 V 640 Q 104,648 112,648 H 136"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>

        <!-- within auth -->
        <line x1="460" y1="472" x2="460" y2="512" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="208" y1="576" x2="208" y2="616" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="376" y1="576" x2="376" y2="616" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="544" y1="576" x2="544" y2="616" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="712" y1="576" x2="712" y2="616" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="544" y1="680" x2="544" y2="720" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>

        <!-- client -> kakao -->
        <line x1="712" y1="680" x2="712" y2="848" stroke="#2e5aa8" stroke-width="1" marker-end="url(#pkg-auth-in-arrow-link)"/>

        <!-- JwtProvider -> User (bottom channel, hops over client->kakao) -->
        <path d="M 208,680 V 808 Q 208,816 216,816 H 704 a 8,8 0 0,1 16,0 H 880 Q 888,816 888,808 V 476 Q 888,468 896,468 H 952"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>

        <path d="M 544,784 V 824 Q 544,832 552,832 H 704 a 8,8 0 0,1 16,0 H 896 Q 904,832 904,824 V 500 Q 904,492 912,492 H 952"
              fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>

        <!-- (1) AuthService => UserService -->
        <path d="M 784,524 H 848 Q 856,524 856,516 V 264 Q 856,256 864,256 H 952"

        <!-- (2) UserController => AuthService : the one reverse edge -->
        <path d="M 952,144 H 848 Q 840,144 840,152 V 540 Q 840,548 832,548 H 784"

        <!-- within user -->
        <line x1="1080" y1="176" x2="1080" y2="224" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>
        <line x1="1080" y1="288" x2="1080" y2="336" stroke="#4f5d75" stroke-width="1" marker-end="url(#pkg-auth-in-arrow)"/>

        <!-- arrow labels -->
        <rect x="784" y="392" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="816" y="404" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">① 단방향</text>
        <rect x="768" y="192" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="800" y="204" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">② 탈퇴만</text>

        <!-- ================= nodes ================= -->
        <!-- SecurityConfig -->
        <rect x="136" y="112" width="312" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="136" y="112" width="312" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

        <text x="292" y="158" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">global/config</text>

        <!-- EntryPoint + AccessDeniedHandler -->
        <rect x="472" y="112" width="312" height="64" rx="6" fill="#f5f5f5"/>

        <text x="628" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JwtAuthenticationEntryPoint</text>
        <text x="628" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JwtAccessDeniedHandler</text>
        <text x="628" y="166" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">global/security</text>

        <!-- JwtAuthenticationFilter -->
        <rect x="136" y="224" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="136" y="224" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="236" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JwtAuthenticationFilter</text>
        <text x="236" y="270" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">global/security</text>

        <!-- CustomUserDetailsService -->
        <rect x="360" y="224" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="224" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CustomUserDetailsService</text>
        <text x="460" y="270" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">global/security</text>

        <!-- UserPrincipal -->
        <rect x="584" y="224" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="224" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="684" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UserPrincipal</text>
        <text x="684" y="270" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">global/security</text>

        <!-- AuthController -->
        <rect x="136" y="408" width="648" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="136" y="408" width="648" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AuthController</text>
        <text x="460" y="454" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">domain/auth/controller</text>

        <!-- AuthService (focal) -->
        <rect x="136" y="512" width="648" height="64" rx="6" fill="#f5f5f5"/>

        <text x="460" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AuthService</text>
        <text x="460" y="558" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">domain/auth/service</text>

        <!-- JwtProvider -->
        <rect x="136" y="616" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="136" y="616" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="208" y="644" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JwtProvider</text>
        <text x="208" y="662" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth/token</text>

        <!-- SecureTokenGenerator -->
        <rect x="304" y="616" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="616" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="376" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SecureToken</text>
        <text x="376" y="654" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generator</text>
        <text x="376" y="670" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth/token</text>

        <!-- RefreshTokenRepository -->
        <rect x="472" y="616" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="616" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="544" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RefreshToken</text>
        <text x="544" y="654" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repository</text>
        <text x="544" y="670" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth/repository</text>

        <!-- KakaoOAuthClient -->
        <rect x="640" y="616" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="616" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="712" y="644" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KakaoOAuthClient</text>
        <text x="712" y="662" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth/client</text>

        <!-- RefreshToken (entity) -->
        <rect x="472" y="720" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="720" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="544" y="748" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RefreshToken</text>
        <text x="544" y="766" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth/entity</text>

        <!-- UserController -->
        <rect x="952" y="112" width="256" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="952" y="112" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1080" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UserController</text>
        <text x="1080" y="158" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">domain/user/controller</text>

        <!-- UserService -->
        <rect x="952" y="224" width="256" height="64" rx="6" fill="#f5f5f5"/>

        <text x="1080" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UserService</text>
        <text x="1080" y="270" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">domain/user/service</text>

        <!-- UserRepository -->

</body>
</html>
